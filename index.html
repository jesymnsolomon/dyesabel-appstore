<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Apps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#fff8ec;color:#16131c;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px;box-sizing:border-box}
      h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:40px;margin:0 0 6px;letter-spacing:-.02em}
      p{margin:0 0 28px;color:#6d6878}
      .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:360px;width:100%}
      a{text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:14px}
      a img{width:76px;height:76px;border-radius:22px;box-shadow:0 10px 24px -10px rgba(255,111,181,.6)}
    </style>
  </head>
  <body>
    <h1>My Apps</h1>
    <p>Open one, then Share → Add to Home Screen.</p>
    <div class="grid">
      <a href="/splitsy/"><img src="/apps/splitsy/icon-192.png" alt="" />Splitsy</a>
    </div>
  </body>
</html>
